<ol class="about-timeline">
  {{- range . }}
  <li>
    {{- with .period }}<p class="about-period">{{ . }}</p>{{ end }}
    <h3>{{ if .url }}<a href="{{ .url | safeURL }}">{{ .title }}</a>{{ else }}{{ .title }}{{ end }}</h3>
    {{- with .detail }}<p class="about-detail">{{ . }}</p>{{ end }}
  </li>
  {{- end }}
</ol>
